name: Keep the free database awake

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # GitHub switches off scheduled jobs in a public repo after 60 quiet days.
      # A small weekly commit on a side branch keeps this job running.
      - uses: actions/checkout@v4
      - name: Heartbeat
        run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "Heartbeat" -m "Keeps scheduled jobs running."
          git push --force origin HEAD:refs/heads/heartbeat
      - name: Ping the database
        if: always()
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$REF" ] || [ -z "$KEY" ]; then echo "No project connected yet."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$REF.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "authorization: Bearer $KEY" -H 'content-type: application/json' -d '{}')
          echo "Ping answered with $code"
          [ "$code" = "200" ]
