# Used by the local stack in CI and by "supabase functions deploy". The hosted
# project is configured by scripts/configure-project.mjs.
project_id = "victory-team"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.auth]
verify_jwt = false

[studio]
enabled = false

[inbucket]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false
